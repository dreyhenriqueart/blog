<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMS // VEGA-1</title>
  <script>
    (function () {
      try {
        var key = "spacecomms-theme";
        var saved = localStorage.getItem(key);
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
    @font-face {
      font-family: "Cascadia Mono";
      src: url("fonts/CascadiaMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root,
    html[data-theme="dark"] {
      --bg: #0c0c14;
      --fg: #cccccc;
      --fg-soft: #e8e8e8;
      --fg-dim: #808080;
      --cursor: #cccccc;
    }

    html[data-theme="light"] {
      --bg: #cccccc;
      --fg: #0c0c14;
      --fg-soft: #3a3a48;
      --fg-dim: #808080;
      --cursor: #0c0c14;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: 12pt;
      line-height: 1.15;
      font-weight: 400;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      text-rendering: geometricPrecision;
    }

    body {
      min-height: 100vh;
    }

    /* Windows Terminal default padding: 8, 8, 8, 8 */
    .layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
      margin: 0;
      padding: 8px;
      gap: 2ch;
    }

    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      color: var(--fg-dim);
      font: inherit;
      letter-spacing: normal;
      margin-bottom: 1em;
      user-select: none;
      flex-shrink: 0;
    }

    .status-bar span {
      color: var(--fg-dim);
    }

    .cmd-btn {
      background: none;
      border: none;
      color: var(--fg-dim);
      font: inherit;
      line-height: inherit;
      padding: 0;
      cursor: pointer;
      vertical-align: baseline;
    }

    .cmd-btn:hover {
      color: var(--fg-soft);
    }

    #feed {
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sidebar {
      min-width: max-content;
      flex-shrink: 0;
    }

    .sidebar-title {
      color: var(--fg-dim);
      font: inherit;
      letter-spacing: normal;
      margin-bottom: 1em;
      user-select: none;
      white-space: nowrap;
    }

    #archive {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .archive-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font: inherit;
      color: var(--fg-dim);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
    }

    .archive-item:hover {
      color: var(--fg-soft);
    }

    .archive-item.is-active {
      color: var(--fg);
    }

    .line {
      min-height: 1.15em;
      color: var(--fg-dim);
      line-height: 1.15;
    }

    .line--sys,
    .line--sep {
      color: var(--fg-dim);
    }

    .line--meta {
      color: var(--fg-dim);
    }

    .meta-hi {
      color: var(--fg);
    }

    .meta-dim {
      color: var(--fg-dim);
    }

    /* Único texto “brilhante” contínuo: corpo da mensagem */
    .line--body {
      color: var(--fg);
      max-width: var(--msg-wrap, 42ch);
    }

    /* Separadores: espaçamento controlado por classe */
    .line--sep {
      margin-top: 0;
      margin-bottom: 0;
    }

    /* SYS → traçada: duas linhas; traçada → INCOMING: zero */
    .line--sep-boot {
      margin-top: calc(2 * 1.15em);
      margin-bottom: 0;
    }

    /* END → traçada final: zero */
    .line--sep-end {
      margin-top: 0;
      margin-bottom: 0;
    }

    .line--blank {
      min-height: 1.15em;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1em;
      background: var(--cursor);
      vertical-align: text-bottom;
      margin-left: 0;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .line--incoming-flash {
      animation: incoming-flash 1s linear infinite;
    }

    @keyframes incoming-flash {
      0%, 49.999% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @media (max-width: 720px) {
      .layout {
        flex-direction: column;
        padding: 8px;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        padding-top: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <main class="main-column">
      <header class="status-bar">
        COMMS TERMINAL v<span id="terminal-version">4.2.1</span> &nbsp;|&nbsp;
        <span id="clock">--</span> &nbsp;|&nbsp;
        LISTENER: <span id="listener">INIT</span>
        &nbsp;|&nbsp;
        <button type="button" id="theme-toggle" class="cmd-btn" aria-label="Alternar tema claro/escuro">THEME: DARK</button>
      </header>

      <div id="feed" aria-live="polite" aria-label="Transmissão ativa"></div>
    </main>

    <aside class="sidebar">
      <div class="sidebar-title">Transmissions</div>
      <ul id="archive"></ul>
    </aside>
  </div>

  <script src="posts-store.js"></script>
  <script>
    const PREVIEW_KEY = "spacecomms-preview";
    const DO_EPOCH = 1000; // Mil d.O. — ano real menos 1000 (ex.: 2026 → 1026 d.O.)
    const SEPARATOR = "────────────────────────────────────────";
    const SIDEBAR_MAX = 21;
    const POLL_MS = 2000;
    const isPreview = new URLSearchParams(location.search).get("preview") === "1";

    const BOOT = [
      { type: "sys", text: "[SYS] initializing deep space comms terminal..." },
      { type: "sys", text: "[SYS] decrypt channel // key exchange OK" },
      { type: "sys", text: "[SYS] uplink established // latency: 14m 22s" },
      { type: "sep", text: SEPARATOR }
    ];

    const feed = document.getElementById("feed");
    const archiveEl = document.getElementById("archive");
    const listenerEl = document.getElementById("listener");
    const clockEl = document.getElementById("clock");
    const themeToggleEl = document.getElementById("theme-toggle");
    const THEME_KEY = "spacecomms-theme";

    function systemTheme() {
      return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }

    function applyTheme(theme, { persist = false } = {}) {
      const next = theme === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      if (themeToggleEl) themeToggleEl.textContent = `THEME: ${next.toUpperCase()}`;
      if (persist) localStorage.setItem(THEME_KEY, next);
    }

    function initThemeControls() {
      const saved = localStorage.getItem(THEME_KEY);
      applyTheme(saved === "light" || saved === "dark" ? saved : systemTheme());

      if (themeToggleEl) {
        themeToggleEl.addEventListener("click", () => {
          applyTheme(currentTheme() === "dark" ? "light" : "dark", { persist: true });
        });
      }

      window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
        if (!localStorage.getItem(THEME_KEY)) applyTheme(systemTheme());
      });
    }

    initThemeControls();

    let posts = [];
    let activePostId = null;
    let activeLine = null;
    let activeCursor = null;
    let typing = false;
    let bootComplete = false;
    let knownPostIds = new Set();
    const queue = [];

    function parsePost(raw) {
      return {
        id: raw.id,
        sentAt: new Date(raw.sentAt),
        origin: raw.origin,
        callsign: raw.callsign,
        lines: Array.isArray(raw.lines) ? raw.lines : [String(raw.lines || "")],
        lost: Boolean(raw.lost)
      };
    }

    function displayLines(post) {
      if (post.lost) return ["signal lost"];
      return post.lines;
    }

    async function loadPosts() {
      if (isPreview) {
        const raw = localStorage.getItem(PREVIEW_KEY);
        if (!raw) throw new Error("preview missing");
        const data = JSON.parse(raw);
        applyTerminalVersion(data.terminalVersion || "4.2.1");
        return (data.posts || [])
          .filter((raw) => !raw.archived)
          .map(parsePost)
          .sort((a, b) => a.sentAt - b.sentAt);
      }

      const store = await SpaceCommsStore.fetchStore({ preferLive: true });
      applyTerminalVersion(store.terminalVersion);
      return store.posts
        .filter((post) => !post.archived)
        .map(parsePost)
        .sort((a, b) => a.sentAt - b.sentAt);
    }

    function postsSignature(list) {
      return list.map((p) => `${p.id}:${p.lost ? 1 : 0}`).join("|");
    }

    async function pollForNewPosts() {
      if (isPreview || !bootComplete || typing) return;

      try {
        const store = await SpaceCommsStore.fetchStore({
          preferLive: true,
          allowEmpty: true
        });
        applyTerminalVersion(store.terminalVersion);
        const fresh = store.posts
          .filter((post) => !post.archived)
          .map(parsePost)
          .sort((a, b) => a.sentAt - b.sentAt);
        const freshIds = new Set(fresh.map((post) => post.id));
        const newcomers = fresh
          .filter((post) => !knownPostIds.has(post.id) && !post.lost)
          .sort((a, b) => a.sentAt - b.sentAt);
        const signatureChanged = postsSignature(fresh) !== postsSignature(posts);
        const prevActive = posts.find((p) => p.id === activePostId);
        const activeNow = fresh.find((p) => p.id === activePostId);
        const activeBecameLost = Boolean(activeNow && activeNow.lost && prevActive && !prevActive.lost);

        if (newcomers.length === 0 && !signatureChanged) return;

        posts = fresh;
        knownPostIds = freshIds;
        renderSidebar();

        const activeStillExists = fresh.some((p) => String(p.id) === String(activePostId));
        if (!activeStillExists) {
          if (fresh.length === 0) {
            resetFeedKeepBoot();
            createLine("sys", "[SYS] no transmissions on uplink");
            activePostId = null;
            return;
          }
          const latest = getLatestPost();
          enqueuePost(latest, { typeBody: false });
          return;
        }

        if (activeBecameLost) {
          enqueuePost(activeNow, { typeBody: false });
          return;
        }

        // Só transmite (com cursor) a mais recente entre as novas
        if (newcomers.length > 0) {
          enqueuePost(newcomers[newcomers.length - 1], { typeBody: true });
        }
      } catch {
        // uplink retry on next poll
      }
    }

    function startLiveListener() {
      if (isPreview) return;
      setInterval(pollForNewPosts, POLL_MS);
      if (SpaceCommsStore.onLiveChange) {
        SpaceCommsStore.onLiveChange(() => {
          pollForNewPosts();
        });
      }
    }

    function doYear(date) {
      return date.getFullYear() - DO_EPOCH;
    }

    function formatDoDate(date) {
      const formatter = new Intl.DateTimeFormat(undefined, {
        day: "numeric",
        month: "numeric",
        year: "numeric"
      });
      const parts = formatter.formatToParts(date);
      let output = "";
      for (const part of parts) {
        if (part.type === "year") {
          output += `${doYear(date)} d.O.`;
        } else {
          output += part.value;
        }
      }
      return output.replace(/\//g, ".").replace(/-/g, ".");
    }

    function formatLocalTime(date) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      }).format(date);
    }

    function formatIncomingStamp(date) {
      return `${formatDoDate(date)} ${formatLocalTime(date)}`;
    }

    function formatHeaderClock(date) {
      return `${formatDoDate(date)} ${formatLocalTime(date)}`;
    }

    function formatSidebarLabel(post) {
      const date = formatDoDate(post.sentAt).replace(" d.O.", "");
      if (post.lost) return `${date} Lost`;
      const text = post.lines.join(" ").trim().slice(0, SIDEBAR_MAX);
      return `${date} ${text}`;
    }

    function getLatestPost() {
      // Sempre a mais recente por tempo — inclusive se estiver Lost
      return posts[posts.length - 1];
    }

    function buildTransmissionEnd(endedAt) {
      const stamp = formatIncomingStamp(endedAt);
      return `[${stamp}] << TRANSMISSION END //`;
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function updateClock() {
      clockEl.textContent = formatHeaderClock(new Date());
    }

    function clearFeed() {
      feed.innerHTML = "";
      activeLine = null;
      if (activeCursor) {
        activeCursor = null;
      }
    }

    /** Repõe o bloco [SYS] instantâneo (não reanima). Mantém o que já funcionava no boot. */
    function paintBootStatic() {
      for (const item of BOOT) {
        if (item.type === "sep") createSep("boot");
        else createLine(item.type, item.text);
      }
    }

    function resetFeedKeepBoot() {
      clearFeed();
      paintBootStatic();
    }

    function createLine(type, text, { html = false } = {}) {
      const el = document.createElement("div");
      el.className = `line line--${type}`;
      if (text !== undefined) {
        if (html) el.innerHTML = text;
        else el.textContent = text;
      }
      feed.appendChild(el);
      return el;
    }

    function attachCursor(lineEl) {
      if (activeCursor && activeCursor.parentNode) {
        activeCursor.remove();
      }
      activeLine = lineEl;
      activeCursor = document.createElement("span");
      activeCursor.className = "cursor";
      activeCursor.setAttribute("aria-hidden", "true");
      lineEl.appendChild(activeCursor);
    }

    function removeCursor() {
      if (activeCursor && activeCursor.parentNode) {
        activeCursor.remove();
      }
      activeCursor = null;
    }

    async function typeText(lineEl, text, speedMin = 28, speedMax = 56) {
      const chars = String(text ?? "");
      attachCursor(lineEl);
      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        lineEl.insertBefore(document.createTextNode(ch), activeCursor);
        let pause = rand(speedMin, speedMax);
        if (ch === "." || ch === "," || ch === "…" ) pause += rand(80, 180);
        if (ch === "\n") pause += rand(120, 280);
        await delay(pause);
      }
    }

    async function typeLine(type, text) {
      const lineEl = createLine(type);
      await typeText(lineEl, text);
      return lineEl;
    }

    async function revealLine(type, text, pauseMs, { html = false } = {}) {
      const lineEl = createLine(type, text === undefined ? "" : text, { html });
      await delay(pauseMs ?? rand(420, 680));
      return lineEl;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildIncomingHeaderHtml(post) {
      const sentAt = post.sentAt instanceof Date ? post.sentAt : new Date(post.sentAt);
      const stamp = escapeHtml(formatIncomingStamp(sentAt));
      const origin = escapeHtml(post.origin);
      const callsign = escapeHtml(post.callsign);
      return (
        `<span class="meta-dim">[${stamp}] &lt;&lt; </span>` +
        `<span class="meta-hi">INCOMING</span>` +
        `<span class="meta-dim"> // </span>` +
        `<span class="meta-hi">ORIGIN: ${origin}</span>` +
        `<span class="meta-dim"> / </span>` +
        `<span class="meta-hi">CALLSIGN: ${callsign}</span>`
      );
    }

    function buildTransmissionEndHtml(endedAt) {
      const stamp = escapeHtml(formatIncomingStamp(endedAt));
      return (
        `<span class="meta-dim">[${stamp}] &lt;&lt; </span>` +
        `<span class="meta-hi">TRANSMISSION END</span>` +
        `<span class="meta-dim"> //</span>`
      );
    }

    function buildIncomingHeader(post) {
      const sentAt = post.sentAt instanceof Date ? post.sentAt : new Date(post.sentAt);
      const stamp = formatIncomingStamp(sentAt);
      return `[${stamp}] << INCOMING // ORIGIN: ${post.origin} / CALLSIGN: ${post.callsign}`;
    }

    function incomingWrapPrefix(post) {
      return buildIncomingHeader(post);
    }

    function setMessageWrap(post) {
      document.documentElement.style.setProperty(
        "--msg-wrap",
        `${incomingWrapPrefix(post).length + 4}ch`
      );
    }

    function createSep(kind) {
      const el = createLine("sep", SEPARATOR);
      if (kind === "boot") el.classList.add("line--sep-boot");
      if (kind === "end") el.classList.add("line--sep-end");
      return el;
    }

    function applyTerminalVersion(version) {
      const el = document.getElementById("terminal-version");
      if (el) el.textContent = String(version || "4.2.1").trim() || "4.2.1";
    }

    /** Bloco inteiro linha a linha (sem digitar). Usado no boot, lateral e signal lost. */
    async function revealPost(post) {
      setMessageWrap(post);
      await delay(rand(120, 240));

      await revealLine("meta", buildIncomingHeaderHtml(post), rand(160, 280), { html: true });
      await revealLine("blank", "", rand(80, 140));
      await revealLine("blank", "", rand(80, 140));

      let lastBodyLine = null;
      for (const line of displayLines(post)) {
        lastBodyLine = await revealLine("body", String(line), rand(160, 280));
      }

      await revealLine("blank", "", rand(80, 140));
      await revealLine("blank", "", rand(80, 140));
      await revealLine("meta", buildTransmissionEndHtml(new Date()), rand(160, 280), { html: true });
      createSep("end");
      if (lastBodyLine) attachCursor(lastBodyLine);
    }

    /** Só mensagens novas: corpo digitado com cursor. Lost → revealPost. */
    async function transmitPost(post) {
      if (post.lost) {
        await revealPost(post);
        return;
      }

      setMessageWrap(post);
      await delay(rand(180, 360));

      const incomingLine = createLine("meta", buildIncomingHeaderHtml(post), { html: true });
      incomingLine.classList.add("line--incoming-flash");
      await delay(5000);
      incomingLine.classList.remove("line--incoming-flash");

      await revealLine("blank", "", rand(80, 140));
      await revealLine("blank", "", rand(80, 140));
      await delay(rand(100, 200));

      let lastBodyLine = null;
      for (const line of displayLines(post)) {
        lastBodyLine = await typeLine("body", String(line));
        await delay(rand(120, 280));
      }

      await revealLine("blank", "", rand(80, 140));
      await revealLine("blank", "", rand(80, 140));
      await revealLine("meta", buildTransmissionEndHtml(new Date()), rand(160, 280), { html: true });
      createSep("end");
      if (lastBodyLine) attachCursor(lastBodyLine);
    }

    function renderSidebar() {
      archiveEl.innerHTML = "";
      const sorted = [...posts].sort((a, b) => b.sentAt - a.sentAt);

      for (const post of sorted) {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "archive-item";
        btn.dataset.postId = post.id;
        btn.textContent = formatSidebarLabel(post);
        btn.addEventListener("click", () => selectPost(post.id));
        li.appendChild(btn);
        archiveEl.appendChild(li);
      }

      updateSidebarActive();
    }

    function updateSidebarActive() {
      archiveEl.querySelectorAll(".archive-item").forEach((btn) => {
        btn.classList.toggle("is-active", String(btn.dataset.postId) === String(activePostId));
      });
    }

    async function selectPost(postId) {
      const post = posts.find((p) => String(p.id) === String(postId));
      if (!post || typing) return;

      activePostId = post.id;
      updateSidebarActive();

      typing = true;
      listenerEl.textContent = "RX";
      try {
        resetFeedKeepBoot();
        await revealPost(post);
      } finally {
        typing = false;
        listenerEl.textContent = "ACTIVE";
      }
    }

    async function runBoot() {
      removeCursor();
      listenerEl.textContent = "SYNC";

      for (const item of BOOT) {
        if (item.type === "sep") createSep("boot");
        else createLine(item.type, item.text);
        await delay(rand(220, 380));
      }

      listenerEl.textContent = "ACTIVE";
    }

    async function processQueue() {
      if (typing) return;
      typing = true;
      listenerEl.textContent = "RX";

      try {
        while (queue.length > 0) {
          const item = queue.shift();
          const post = item.post;
          const typeBody = Boolean(item.typeBody) && !post.lost;
          activePostId = post.id;
          updateSidebarActive();
          resetFeedKeepBoot();
          if (typeBody) await transmitPost(post);
          else await revealPost(post);
        }
      } finally {
        typing = false;
        listenerEl.textContent = "ACTIVE";
      }
    }

    function enqueuePost(post, { typeBody = false } = {}) {
      queue.push({ post, typeBody });
      processQueue();
    }

    function normalizePost(post) {
      const lines = Array.isArray(post.lines)
        ? post.lines
        : [String(post.body || post.text || "")];

      return {
        id: post.id || String(Date.now()),
        sentAt: post.sentAt ? new Date(post.sentAt) : new Date(),
        origin: post.origin || "UNKNOWN",
        callsign: post.callsign || "UNKNOWN",
        lines
      };
    }

    async function boot() {
      updateClock();
      setInterval(updateClock, 1000);
      listenerEl.textContent = "SYNC";

      let loaded = [];
      try {
        loaded = await loadPosts();
      } catch (err) {
        listenerEl.textContent = "ERR";
        await runBoot();
        createLine("sys", "[SYS] failed to load transmissions");
        bootComplete = true;
        startLiveListener();
        return;
      }

      posts = loaded;
      knownPostIds = new Set(posts.map((post) => post.id));
      renderSidebar();

      clearFeed();
      await runBoot();

      if (posts.length === 0) {
        listenerEl.textContent = "IDLE";
        createLine("sys", "[SYS] no transmissions on uplink");
        createSep("end");
        bootComplete = true;
        startLiveListener();
        return;
      }

      const latest = getLatestPost();
      activePostId = latest.id;
      updateSidebarActive();

      typing = true;
      listenerEl.textContent = "RX";
      try {
        await revealPost(latest);
      } finally {
        typing = false;
        listenerEl.textContent = "ACTIVE";
        bootComplete = true;
        startLiveListener();
      }
    }

    boot().catch(() => {
      listenerEl.textContent = "ERR";
      createLine("sys", isPreview
        ? "[SYS] preview unavailable — compose again in admin"
        : "[SYS] failed to load transmissions");
      bootComplete = true;
    });
  </script>
</body>
</html>
