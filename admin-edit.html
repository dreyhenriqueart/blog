<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMS // ADMIN EDIT</title>
  <style>
    @font-face {
      font-family: "Cascadia Mono";
      src: url("fonts/CascadiaMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0c0c14;
      --fg: #cccccc;
      --fg-soft: #e8e8e8;
      --fg-dim: #808080;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: 12pt;
      line-height: 1;
      -webkit-font-smoothing: none;
      text-rendering: geometricPrecision;
    }

    html.is-locked .screen { display: none; }
    .screen { max-width: 720px; padding: 8px; }

    .status-bar {
      color: var(--fg);
      margin-bottom: 1.5rem;
      user-select: none;
    }
    .status-bar span { color: var(--fg); }
    .sys-line { color: var(--fg); margin-bottom: 0.5rem; }

    .nav-link {
      display: inline-block;
      margin-top: 1.5rem;
      margin-right: 1.25rem;
      color: var(--fg);
      text-decoration: none;
      font: inherit;
    }
    .nav-link:hover { color: var(--fg-soft); }

    .manage-title {
      color: var(--fg);
      margin: 1.5rem 0 0.75rem;
    }

    #post-list { list-style: none; margin-bottom: 1rem; }

    .post-item { margin-bottom: 0.15rem; }

    .post-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      line-height: 1;
    }

    .post-row input[type="checkbox"] {
      width: auto;
      margin: 0.2rem 0 0;
      accent-color: var(--fg);
    }

    .post-row__name {
      background: none;
      border: none;
      font: inherit;
      color: var(--fg);
      cursor: pointer;
      padding: 0;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
    }
    .post-row__name:hover,
    .post-row__name.is-open { color: var(--fg-soft); }
    .post-row__name.is-lost { color: var(--fg-dim); }

    .post-preview {
      display: none;
      color: var(--fg);
      white-space: pre-wrap;
      margin: 0.25rem 0 0.75rem 1.35rem;
    }
    .post-preview.is-open { display: block; }

    .manage-empty {
      color: var(--fg);
      margin-bottom: 1rem;
    }

    .actions {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    button {
      background: none;
      border: none;
      font: inherit;
      color: var(--fg);
      cursor: pointer;
      padding: 0;
      text-align: left;
    }
    button:hover { color: var(--fg-soft); }
    button:disabled { color: var(--fg-soft); cursor: wait; }

    .status-msg { margin-top: 0.75rem; display: none; }
    .status-msg.is-visible { display: block; }
    .error { color: var(--fg); }
    .success { color: var(--fg); }

    .auth-gate { max-width: 720px; padding: 8px; }
  </style>
</head>
<body>
  <main class="screen">
    <header class="status-bar">
      COMMS ADMIN v0.1 &nbsp;|&nbsp;
      <span id="clock">--</span> &nbsp;|&nbsp;
      MODE: <span>EDIT</span>
    </header>

    <p class="sys-line">[SYS] transmission registry open</p>

    <div class="manage-title">Transmissions</div>
    <ul id="post-list"></ul>
    <p id="manage-empty" class="manage-empty" hidden>[SYS] no transmissions stored</p>

    <div class="actions">
      <button type="button" id="delete-btn">COMMS&gt; delete_</button>
      <button type="button" id="purge-btn">COMMS&gt; purge_</button>
    </div>

    <p id="status-error" class="status-msg error" role="alert"></p>
    <p id="status-success" class="status-msg success" role="status"></p>

    <a class="nav-link" href="admin.html">COMMS&gt; compose_</a>
  </main>

  <script src="admin-auth.js"></script>
  <script src="posts-store.js?v=20260824c"></script>
  <script>
    const DO_EPOCH = 1000;
    const SIDEBAR_MAX = 21;

    const clockEl = document.getElementById("clock");
    const postListEl = document.getElementById("post-list");
    const manageEmptyEl = document.getElementById("manage-empty");
    const deleteBtn = document.getElementById("delete-btn");
    const purgeBtn = document.getElementById("purge-btn");
    const errorEl = document.getElementById("status-error");
    const successEl = document.getElementById("status-success");

    function doYear(date) { return date.getFullYear() - DO_EPOCH; }

    function formatDoDate(date) {
      const formatter = new Intl.DateTimeFormat(undefined, {
        day: "numeric", month: "numeric", year: "numeric"
      });
      const parts = formatter.formatToParts(date);
      let output = "";
      for (const part of parts) {
        if (part.type === "year") output += `${doYear(date)} d.O.`;
        else output += part.value;
      }
      return output.replace(/\//g, ".").replace(/-/g, ".");
    }

    function formatLocalTime(date) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "numeric", minute: "2-digit", second: "2-digit"
      }).format(date);
    }

    function updateClock() {
      const stamp = `${formatDoDate(new Date())} ${formatLocalTime(new Date())}`;
      if (clockEl) clockEl.textContent = stamp;
      const gateClock = document.getElementById("clock-gate");
      if (gateClock) gateClock.textContent = stamp;
    }

    function showError(message) {
      successEl.classList.remove("is-visible");
      errorEl.textContent = message;
      errorEl.classList.add("is-visible");
    }

    function showSuccess(message) {
      errorEl.classList.remove("is-visible");
      successEl.textContent = message;
      successEl.classList.add("is-visible");
    }

    function clearStatus() {
      errorEl.classList.remove("is-visible");
      successEl.classList.remove("is-visible");
    }

    function setBusy(isBusy) {
      deleteBtn.disabled = isBusy;
      purgeBtn.disabled = isBusy;
    }

    function formatPostLabel(post) {
      const date = formatDoDate(new Date(post.sentAt)).replace(" d.O.", "");
      const text = (post.lost ? "signal lost" : post.lines.join(" ").trim()).slice(0, SIDEBAR_MAX);
      const mark = post.lost ? " [lost]" : "";
      return `${date} ${text}${mark}`;
    }

    function getSelectedPostIds() {
      return [...postListEl.querySelectorAll('input[type="checkbox"]:checked')].map(
        (input) => input.value
      );
    }

    async function renderPostList() {
      clearStatus();
      postListEl.innerHTML = "";

      let posts = [];
      try {
        posts = await SpaceCommsStore.fetchAllPosts({ fresh: true });
      } catch {
        showError("[ERR] falha ao carregar transmissoes.");
        manageEmptyEl.hidden = true;
        return;
      }

      posts.sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt));

      if (posts.length === 0) {
        manageEmptyEl.hidden = false;
        return;
      }
      manageEmptyEl.hidden = true;

      for (const post of posts) {
        const li = document.createElement("li");
        li.className = "post-item";

        const row = document.createElement("div");
        row.className = "post-row";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = post.id;

        const nameBtn = document.createElement("button");
        nameBtn.type = "button";
        nameBtn.className = "post-row__name" + (post.lost ? " is-lost" : "");
        nameBtn.textContent = formatPostLabel(post);

        const preview = document.createElement("div");
        preview.className = "post-preview";
        preview.textContent = post.lost
          ? "signal lost"
          : (Array.isArray(post.lines) ? post.lines.join("\n") : "");

        nameBtn.addEventListener("click", () => {
          const open = preview.classList.toggle("is-open");
          nameBtn.classList.toggle("is-open", open);
        });

        row.appendChild(checkbox);
        row.appendChild(nameBtn);
        li.appendChild(row);
        li.appendChild(preview);
        postListEl.appendChild(li);
      }
    }

    function bindEdit() {
      deleteBtn.addEventListener("click", async () => {
        const ids = getSelectedPostIds();
        if (ids.length === 0) {
          showError("[ERR] selecione ao menos uma transmissao.");
          return;
        }

        setBusy(true);
        try {
          const result = await SpaceCommsStore.deletePosts(ids);
          if (!result.removed) {
            showError("[ERR] nenhuma transmissao marcada lost.");
          } else {
            showSuccess(`[SYS] signal lost // ${result.removed}`);
          }
          await renderPostList();
        } catch (err) {
          showError(`[ERR] ${err.message}`);
        } finally {
          setBusy(false);
        }
      });

      purgeBtn.addEventListener("click", async () => {
        const ids = getSelectedPostIds();
        if (ids.length === 0) {
          showError("[ERR] selecione ao menos uma transmissao.");
          return;
        }

        setBusy(true);
        try {
          const result = await SpaceCommsStore.purgePosts(ids);
          if (!result.purged) {
            showError("[ERR] nenhuma transmissao removida.");
          } else {
            showSuccess(`[SYS] purged // ${result.purged}`);
          }
          await renderPostList();
        } catch (err) {
          showError(`[ERR] ${err.message}`);
        } finally {
          setBusy(false);
        }
      });

      renderPostList();
    }

    updateClock();
    setInterval(updateClock, 1000);

    SpaceCommsAuth.mountGate({
      onReady() {
        bindEdit();
      }
    });
  </script>
</body>
</html>
