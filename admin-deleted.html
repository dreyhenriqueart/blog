<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMS // ADMIN DELETED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0ede6;
      --fg: #1a1916;
      --fg-dim: #5c5952;
      --fg-muted: #8a877f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Mono", "Consolas", "Courier New", monospace;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    html.is-locked .screen { display: none; }
    .screen { max-width: 720px; padding: 1rem 16px 2rem; }

    .status-bar {
      color: var(--fg-muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
      user-select: none;
    }
    .status-bar span { color: var(--fg-dim); }
    .sys-line { color: var(--fg-dim); margin-bottom: 0.5rem; }

    label {
      display: block;
      color: var(--fg-muted);
      font-size: 13px;
      margin-bottom: 0.35rem;
    }

    input {
      display: block;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: none;
      border-bottom: 1px solid var(--fg-muted);
      font: inherit;
      line-height: 1.55;
      padding: 0.25rem 0;
      margin-bottom: 1.25rem;
      outline: none;
    }
    input:focus { border-bottom-color: var(--fg); }
    .form-block { margin-top: 1.5rem; }

    .nav-link {
      display: inline-block;
      margin-top: 1rem;
      margin-right: 1.25rem;
      color: var(--fg-dim);
      text-decoration: none;
      font: inherit;
    }
    .nav-link:hover { color: var(--fg); }

    .manage-title {
      color: var(--fg-muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      margin: 1.5rem 0 0.75rem;
    }

    #post-list { list-style: none; margin-bottom: 1rem; }

    .post-row {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      font: inherit;
      color: var(--fg-dim);
      font-size: 13px;
      line-height: 1.55;
      padding: 0;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }
    .post-row:hover,
    .post-row.is-open { color: var(--fg); }

    .post-preview {
      display: none;
      color: var(--fg);
      font-size: 13px;
      white-space: pre-wrap;
      margin: 0.35rem 0 0.85rem;
      padding-left: 0;
    }
    .post-preview.is-open { display: block; }

    .manage-empty {
      color: var(--fg-muted);
      font-size: 13px;
      margin-bottom: 1rem;
    }

    .status-msg { margin-top: 0.75rem; display: none; }
    .status-msg.is-visible { display: block; }
    .error { color: var(--fg); }

    button {
      background: none;
      border: none;
      font: inherit;
      color: var(--fg);
      cursor: pointer;
      padding: 0;
      text-align: left;
    }
    button:hover { color: var(--fg-dim); }

    .auth-gate { max-width: 720px; padding: 1rem 16px 2rem; }
  </style>
</head>
<body>
  <main class="screen">
    <header class="status-bar">
      COMMS ADMIN v0.1 &nbsp;|&nbsp;
      <span id="clock">--</span> &nbsp;|&nbsp;
      MODE: <span>DELETED</span>
    </header>

    <p class="sys-line">[SYS] lost transmissions registry</p>
    <p class="sys-line">[SYS] click a name to read original text</p>

    <div class="manage-title">Deleted</div>
    <ul id="post-list"></ul>
    <p id="manage-empty" class="manage-empty" hidden>[SYS] no deleted transmissions</p>
    <p id="status-error" class="status-msg error" role="alert"></p>

    <a class="nav-link" href="admin-edit.html">COMMS&gt; edit_</a>
    <a class="nav-link" href="admin.html">COMMS&gt; compose_</a>
  </main>

  <script src="admin-auth.js"></script>
  <script src="posts-store.js"></script>
  <script>
    const DO_EPOCH = 1000;
    const SIDEBAR_MAX = 21;

    const clockEl = document.getElementById("clock");
    const postListEl = document.getElementById("post-list");
    const manageEmptyEl = document.getElementById("manage-empty");
    const errorEl = document.getElementById("status-error");

    function doYear(date) { return date.getFullYear() - DO_EPOCH; }

    function formatDoDate(date) {
      const formatter = new Intl.DateTimeFormat(undefined, {
        day: "numeric", month: "numeric", year: "numeric"
      });
      const parts = formatter.formatToParts(date);
      let output = "";
      for (const part of parts) {
        if (part.type === "year") output += `${doYear(date)} d.O.`;
        else output += part.value;
      }
      return output.replace(/\//g, ".").replace(/-/g, ".");
    }

    function formatLocalTime(date) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "numeric", minute: "2-digit", second: "2-digit"
      }).format(date);
    }

    function updateClock() {
      const stamp = `${formatDoDate(new Date())} ${formatLocalTime(new Date())}`;
      if (clockEl) clockEl.textContent = stamp;
      const gateClock = document.getElementById("clock-gate");
      if (gateClock) gateClock.textContent = stamp;
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("is-visible");
    }

    function formatPostLabel(post) {
      const date = formatDoDate(new Date(post.sentAt)).replace(" d.O.", "");
      const text = post.lines.join(" ").trim().slice(0, SIDEBAR_MAX);
      return `${date} ${text}`;
    }

    async function renderPostList() {
      errorEl.classList.remove("is-visible");
      postListEl.innerHTML = "";

      let posts = [];
      try {
        posts = await SpaceCommsStore.fetchAllPosts({ fresh: true });
        posts = posts.filter((post) => post.lost);
      } catch {
        showError("[ERR] não foi possível carregar deletados.");
        manageEmptyEl.hidden = true;
        return;
      }

      posts.sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt));

      if (posts.length === 0) {
        manageEmptyEl.hidden = false;
        return;
      }
      manageEmptyEl.hidden = true;

      for (const post of posts) {
        const li = document.createElement("li");

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "post-row";
        btn.textContent = formatPostLabel(post);

        const preview = document.createElement("div");
        preview.className = "post-preview";
        preview.textContent = post.lines.join("\n");

        btn.addEventListener("click", () => {
          const open = preview.classList.toggle("is-open");
          btn.classList.toggle("is-open", open);
        });

        li.appendChild(btn);
        li.appendChild(preview);
        postListEl.appendChild(li);
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    SpaceCommsAuth.mountGate({
      onReady() {
        renderPostList();
      }
    });
  </script>
</body>
</html>
