<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMS // ADMIN</title>
  <style>
    @font-face {
      font-family: "Cascadia Mono";
      src: url("fonts/CascadiaMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0c0c14;
      --fg: #cccccc;
      --fg-soft: #e8e8e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: 12pt;
      line-height: 1;
      -webkit-font-smoothing: none;
      text-rendering: geometricPrecision;
    }

    html.is-locked .screen { display: none; }

    .screen { max-width: 640px; padding: 8px; }

    .status-bar {
      color: var(--fg);
      font-size: inherit;
      letter-spacing: normal;
      margin-bottom: 1.5rem;
      user-select: none;
    }

    .status-bar span { color: var(--fg); }

    .sys-line { color: var(--fg); margin-bottom: 0.5rem; }

    label {
      display: block;
      color: var(--fg);
      font-size: inherit;
      margin-bottom: 0.35rem;
    }

    input, textarea {
      display: block;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: none;
      border-bottom: 1px solid var(--fg);
      font: inherit;
      line-height: 1;
      padding: 0.25rem 0;
      margin-bottom: 1.25rem;
      outline: none;
    }

    input:focus, textarea:focus { border-bottom-color: var(--fg); }

    textarea {
      min-height: 160px;
      resize: vertical;
      white-space: pre-wrap;
    }

    .form-block { margin-top: 1.5rem; }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .nav-link {
      display: inline-block;
      margin-top: 1.5rem;
      margin-right: 1.25rem;
      color: var(--fg);
      text-decoration: none;
      font: inherit;
    }

    .nav-link:hover { color: var(--fg-soft); }

    button {
      background: none;
      border: none;
      font: inherit;
      color: var(--fg);
      cursor: pointer;
      padding: 0;
      text-align: left;
    }

    button:hover { color: var(--fg-soft); }
    button:disabled { color: var(--fg-soft); cursor: wait; }

    .hint { color: var(--fg); font-size: inherit; margin-top: 1rem; }

    .status-msg { margin-top: 0.75rem; display: none; }
    .status-msg.is-visible { display: block; }
    .error { color: var(--fg); }
    .success { color: var(--fg); }

    .auth-gate {
      max-width: 640px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="status-bar">
      COMMS ADMIN v0.1 &nbsp;|&nbsp;
      <span id="clock">--</span> &nbsp;|&nbsp;
      MODE: <span>COMPOSE</span>
    </header>

    <p class="sys-line">[SYS] uplink compose channel open</p>

    <form id="compose-form" class="form-block">
      <label for="terminal-version">COMMS TERMINAL v</label>
      <input id="terminal-version" name="terminal-version" type="text" value="4.2.1" autocomplete="off" pattern="[0-9]+(\.[0-9]+)*" title="somente o número, ex.: 4.2.1" />

      <label for="origin">ORIGIN</label>
      <input id="origin" name="origin" type="text" value="ASTR-7" autocomplete="off" required />

      <label for="callsign">CALLSIGN</label>
      <input id="callsign" name="callsign" type="text" value="VEGA-1" autocomplete="off" required />

      <label for="message">TRANSMISSION BODY</label>
      <textarea id="message" name="message" placeholder="Uma linha por paragrafo." required></textarea>

      <div class="actions">
        <button type="button" id="version-btn">COMMS&gt; set version_</button>
        <button type="submit" id="preview-btn">COMMS&gt; preview_</button>
        <button type="button" id="publish-btn">COMMS&gt; publish_</button>
      </div>

      <p id="error" class="status-msg error" role="alert"></p>
      <p id="success" class="status-msg success" role="status"></p>
      <p class="hint">Entre com a senha do admin. Depois disso, publish e edit funcionam sem pedir nada.</p>
    </form>

    <a class="nav-link" href="admin-edit.html">COMMS&gt; edit_</a>
    <a class="nav-link" href="admin-deleted.html">COMMS&gt; deleted_</a>
  </main>

  <script src="admin-auth.js"></script>
  <script src="posts-store.js"></script>
  <script>
    const PREVIEW_KEY = "spacecomms-preview";
    const DO_EPOCH = 1000;

    const clockEl = document.getElementById("clock");
    const form = document.getElementById("compose-form");
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");
    const previewBtn = document.getElementById("preview-btn");
    const publishBtn = document.getElementById("publish-btn");
    const versionBtn = document.getElementById("version-btn");
    const versionInput = document.getElementById("terminal-version");

    function doYear(date) { return date.getFullYear() - DO_EPOCH; }

    function formatDoDate(date) {
      const formatter = new Intl.DateTimeFormat(undefined, {
        day: "numeric", month: "numeric", year: "numeric"
      });
      const parts = formatter.formatToParts(date);
      let output = "";
      for (const part of parts) {
        if (part.type === "year") output += `${doYear(date)} d.O.`;
        else output += part.value;
      }
      return output.replace(/\//g, ".").replace(/-/g, ".");
    }

    function formatLocalTime(date) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "numeric", minute: "2-digit", second: "2-digit"
      }).format(date);
    }

    function updateClock() {
      const stamp = `${formatDoDate(new Date())} ${formatLocalTime(new Date())}`;
      if (clockEl) clockEl.textContent = stamp;
      const gateClock = document.getElementById("clock-gate");
      if (gateClock) gateClock.textContent = stamp;
    }

    function showError(message) {
      successEl.classList.remove("is-visible");
      errorEl.textContent = message;
      errorEl.classList.add("is-visible");
    }

    function showSuccess(message) {
      errorEl.classList.remove("is-visible");
      successEl.textContent = message;
      successEl.classList.add("is-visible");
    }

    function clearStatus() {
      errorEl.classList.remove("is-visible");
      successEl.classList.remove("is-visible");
    }

    function setBusy(isBusy) {
      previewBtn.disabled = isBusy;
      publishBtn.disabled = isBusy;
      versionBtn.disabled = isBusy;
      versionInput.disabled = isBusy;
    }

    async function loadTerminalVersion() {
      try {
        const store = await SpaceCommsStore.fetchStore({ fresh: true });
        versionInput.value = store.terminalVersion || "4.2.1";
      } catch {
        // mantém default do input
      }
    }

    function parseLines(text) {
      return text.split("\n").map((line) => line.trim()).filter(Boolean);
    }

    function readComposePayload() {
      const origin = document.getElementById("origin").value.trim();
      const callsign = document.getElementById("callsign").value.trim();
      const message = document.getElementById("message").value.trim();
      const lines = parseLines(message);

      if (!origin || !callsign || lines.length === 0) {
        showError("[ERR] ORIGIN, CALLSIGN e corpo da transmissão são obrigatórios.");
        return null;
      }

      return { sentAt: new Date().toISOString(), origin, callsign, lines };
    }

    function bindCompose() {
      versionBtn.addEventListener("click", async () => {
        clearStatus();
        const version = versionInput.value.trim();
        if (!version) {
          showError("[ERR] informe o número da versão (ex.: 4.2.1).");
          return;
        }

        setBusy(true);
        try {
          const result = await SpaceCommsStore.setTerminalVersion(version);
          versionInput.value = result.terminalVersion;
          showSuccess(`[SYS] terminal version set // v${result.terminalVersion}`);
        } catch (err) {
          showError(`[ERR] ${err.message}`);
        } finally {
          setBusy(false);
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearStatus();

        const payload = readComposePayload();
        if (!payload) return;

        const draft = { ...payload, id: `preview-${Date.now()}` };

        setBusy(true);
        try {
          const store = await SpaceCommsStore.fetchStore();
          localStorage.setItem(
            PREVIEW_KEY,
            JSON.stringify({
              terminalVersion: store.terminalVersion,
              posts: [...store.posts, draft]
            })
          );
          window.open("index.html?preview=1", "_blank");
        } catch {
          showError("[ERR] Falha ao preparar preview.");
        } finally {
          setBusy(false);
        }
      });

      publishBtn.addEventListener("click", async () => {
        clearStatus();

        const payload = readComposePayload();
        if (!payload) return;

        setBusy(true);
        try {
          const created = await SpaceCommsStore.publishPost(payload);
          showSuccess(`[SYS] published // id ${created.id} // uplink stored`);
          document.getElementById("message").value = "";
        } catch (err) {
          showError(`[ERR] ${err.message}`);
        } finally {
          setBusy(false);
        }
      });
    }

    updateClock();
    setInterval(updateClock, 1000);

    SpaceCommsAuth.mountGate({
      onReady() {
        loadTerminalVersion();
        bindCompose();
      }
    });
  </script>
</body>
</html>
