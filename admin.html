<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMS // ADMIN</title>
  <style>
    @font-face {
      font-family: "Cascadia Mono";
      src: url("fonts/CascadiaMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0c0c14;
      --fg: #cccccc;
      --fg-soft: #e8e8e8;
      --fg-dim: #808080;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg-dim);
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: 12pt;
      line-height: 1;
      -webkit-font-smoothing: none;
      text-rendering: geometricPrecision;
    }

    html.is-locked .screen { display: none; }

    .screen { max-width: 640px; padding: 8px; }

    .status-bar {
      color: var(--fg-dim);
      margin-bottom: 1.5rem;
      user-select: none;
    }

    .status-bar span { color: var(--fg-dim); }

    .sys-line { color: var(--fg-dim); margin-bottom: 0.5rem; }

    label {
      display: block;
      color: var(--fg-dim);
      margin-bottom: 0.35rem;
    }

    .field-row {
      display: flex;
      align-items: stretch;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--fg-dim);
    }

    .field-row input {
      flex: 1;
      min-width: 0;
      display: block;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: none;
      font: inherit;
      line-height: 1;
      padding: 0.25rem 0;
      margin: 0;
      outline: none;
    }

    .field-row .field-action {
      flex: 0 0 auto;
      align-self: center;
      padding: 0 0.15rem;
      color: var(--fg-dim);
    }

    .field-row .field-action:hover,
    .field-row .field-action:focus-visible {
      color: var(--fg);
    }

    input:not([type="file"]), textarea {
      display: block;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: none;
      border-bottom: 1px solid var(--fg-dim);
      font: inherit;
      line-height: 1;
      padding: 0.25rem 0;
      margin-bottom: 1.25rem;
      outline: none;
    }

    input:focus, textarea:focus { border-bottom-color: var(--fg-dim); }

    input::placeholder,
    textarea::placeholder {
      color: var(--fg-dim);
      opacity: 1;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
      white-space: pre-wrap;
    }

    .attach-box {
      position: relative;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--fg-dim);
      padding: 0.35rem 1.75rem 0.5rem 0;
      min-height: 2rem;
    }

    .attach-box input[type="file"] {
      display: block;
      width: 100%;
      background: var(--bg);
      color: var(--fg-dim);
      border: none;
      font: inherit;
      padding: 0;
      margin: 0;
    }

    .attach-box .attach-x {
      position: absolute;
      top: 0.2rem;
      right: 0;
      line-height: 1;
      padding: 0.15rem 0.25rem;
      color: var(--fg-dim);
    }

    .attach-box .attach-x:hover,
    .attach-box .attach-x:focus-visible {
      color: var(--fg);
    }

    .attach-box .attach-x[hidden] { display: none; }

    .attach-box img {
      display: block;
      max-width: 160px;
      max-height: 96px;
      object-fit: contain;
      margin-top: 0.5rem;
      border: 1px solid var(--fg-dim);
    }

    .attach-box img[hidden] { display: none; }

    .form-block { margin-top: 1.5rem; }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .nav-link {
      display: inline-block;
      margin-top: 1.5rem;
      margin-right: 1.25rem;
      color: var(--fg-dim);
      text-decoration: none;
      font: inherit;
    }

    .nav-link:hover,
    .nav-link:focus-visible { color: var(--fg); }

    button {
      background: none;
      border: none;
      font: inherit;
      color: var(--fg-dim);
      cursor: pointer;
      padding: 0;
      text-align: left;
    }

    button:hover,
    button:focus-visible { color: var(--fg); }

    button:disabled {
      color: var(--fg-dim);
      opacity: 0.7;
      cursor: wait;
    }

    #publish-btn {
      color: var(--fg);
    }

    #publish-btn:hover,
    #publish-btn:focus-visible {
      color: var(--fg-soft);
    }

    #publish-btn:disabled {
      color: var(--fg);
      opacity: 0.7;
    }

    .status-msg { margin-top: 0.75rem; display: none; color: var(--fg-dim); }
    .status-msg.is-visible { display: block; }
    .error { color: var(--fg-dim); }
    .success { color: var(--fg-dim); }

    .auth-gate {
      max-width: 640px;
      padding: 8px;
      color: var(--fg-dim);
    }

    .auth-gate .status-bar,
    .auth-gate .status-bar span,
    .auth-gate .sys-line,
    .auth-gate label {
      color: var(--fg-dim);
    }

    .auth-gate input {
      color: var(--fg);
      border-bottom-color: var(--fg-dim);
    }

    .auth-gate button {
      color: var(--fg-dim);
    }

    .auth-gate button:hover,
    .auth-gate button:focus-visible {
      color: var(--fg);
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="status-bar">
      COMMS ADMIN v0.1 &nbsp;|&nbsp;
      <span id="clock">--</span> &nbsp;|&nbsp;
      MODE: <span>COMPOSE</span>
    </header>

    <p class="sys-line">[SYS] uplink compose channel open</p>

    <form id="compose-form" class="form-block">
      <label for="terminal-version">COMMS TERMINAL v</label>
      <div class="field-row">
        <input id="terminal-version" name="terminal-version" type="text" value="4.2.1" autocomplete="off" pattern="[0-9]+(\.[0-9]+)*" title="somente o número, ex.: 4.2.1" />
        <button type="button" id="version-btn" class="field-action" aria-label="Aplicar versão">set_</button>
      </div>

      <label for="origin">ORIGIN</label>
      <input id="origin" name="origin" type="text" value="ASTR-7" autocomplete="off" required />

      <label for="callsign">CALLSIGN</label>
      <input id="callsign" name="callsign" type="text" value="VEGA-1" autocomplete="off" required />

      <label for="message">TRANSMISSION BODY</label>
      <textarea id="message" name="message" placeholder="Uma linha por paragrafo." required></textarea>

      <label for="image">ATTACHMENT</label>
      <div class="attach-box" id="attach-box">
        <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
        <button type="button" id="image-clear" class="attach-x" hidden aria-label="Remover anexo">X</button>
        <img id="image-preview" alt="" hidden />
      </div>

      <div class="actions">
        <button type="submit" id="preview-btn">COMMS&gt; preview_</button>
        <button type="button" id="publish-btn">COMMS&gt; publish_</button>
      </div>

      <p id="error" class="status-msg error" role="alert"></p>
      <p id="success" class="status-msg success" role="status"></p>
    </form>

    <a class="nav-link" href="admin-edit.html">COMMS&gt; edit_</a>
  </main>

  <script src="admin-auth.js"></script>
  <script src="posts-store.js?v=20260824c"></script>
  <script>
    const PREVIEW_KEY = "spacecomms-preview";
    const DO_EPOCH = 1000;

    const clockEl = document.getElementById("clock");
    const form = document.getElementById("compose-form");
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");
    const previewBtn = document.getElementById("preview-btn");
    const publishBtn = document.getElementById("publish-btn");
    const versionBtn = document.getElementById("version-btn");
    const versionInput = document.getElementById("terminal-version");
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("image-preview");
    const imageClear = document.getElementById("image-clear");
    const MAX_IMAGE_BYTES = 8 * 1024 * 1024;
    let pendingImage = null;
    let imageLoading = false;

    function doYear(date) { return date.getFullYear() - DO_EPOCH; }

    function formatDoDate(date) {
      const formatter = new Intl.DateTimeFormat(undefined, {
        day: "numeric", month: "numeric", year: "numeric"
      });
      const parts = formatter.formatToParts(date);
      let output = "";
      for (const part of parts) {
        if (part.type === "year") output += `${doYear(date)} d.O.`;
        else output += part.value;
      }
      return output.replace(/\//g, ".").replace(/-/g, ".");
    }

    function formatLocalTime(date) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "numeric", minute: "2-digit", second: "2-digit"
      }).format(date);
    }

    function updateClock() {
      const stamp = `${formatDoDate(new Date())} ${formatLocalTime(new Date())}`;
      if (clockEl) clockEl.textContent = stamp;
      const gateClock = document.getElementById("clock-gate");
      if (gateClock) gateClock.textContent = stamp;
    }

    function showError(message) {
      successEl.classList.remove("is-visible");
      errorEl.textContent = message;
      errorEl.classList.add("is-visible");
    }

    function showSuccess(message) {
      errorEl.classList.remove("is-visible");
      successEl.textContent = message;
      successEl.classList.add("is-visible");
    }

    function clearStatus() {
      errorEl.classList.remove("is-visible");
      successEl.classList.remove("is-visible");
    }

    function setBusy(isBusy) {
      previewBtn.disabled = isBusy;
      publishBtn.disabled = isBusy;
      versionBtn.disabled = isBusy;
      versionInput.disabled = isBusy;
      imageInput.disabled = isBusy;
      imageClear.disabled = isBusy;
    }

    function clearPendingImage() {
      pendingImage = null;
      imageLoading = false;
      imageInput.value = "";
      imagePreview.removeAttribute("src");
      imagePreview.hidden = true;
      imageClear.hidden = true;
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("imagem inválida"));
        img.src = src;
      });
    }

    async function compressImageFile(file) {
      const objectUrl = URL.createObjectURL(file);
      try {
        const img = await loadImageElement(objectUrl);
        const maxEdge = 1600;
        const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        if (!ctx) throw new Error("canvas indisponível");
        ctx.drawImage(img, 0, 0, width, height);

        const preferPng = file.type === "image/png" || file.type === "image/gif";
        const mime = preferPng ? "image/png" : "image/jpeg";
        const quality = preferPng ? undefined : 0.86;
        const dataUrl = canvas.toDataURL(mime, quality);
        const comma = dataUrl.indexOf(",");
        const base64 = comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl;
        const ext = mime === "image/png" ? "png" : "jpg";
        const baseName = String(file.name || "attachment").replace(/\.[^.]+$/, "");
        return {
          base64,
          mime,
          name: `${baseName || "attachment"}.${ext}`,
          previewUrl: dataUrl
        };
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    async function loadTerminalVersion() {
      try {
        const store = await SpaceCommsStore.fetchStore({ fresh: true });
        versionInput.value = store.terminalVersion || "4.2.1";
      } catch {
        // mantém default do input
      }
    }

    function parseLines(text) {
      return text.split("\n").map((line) => line.trim()).filter(Boolean);
    }

    function readComposePayload() {
      const origin = document.getElementById("origin").value.trim();
      const callsign = document.getElementById("callsign").value.trim();
      const message = document.getElementById("message").value.trim();
      const lines = parseLines(message);

      if (!origin || !callsign || lines.length === 0) {
        showError("[ERR] ORIGIN, CALLSIGN e corpo da transmissão são obrigatórios.");
        return null;
      }

      if (imageLoading) {
        showError("[ERR] anexo ainda carregando — aguarde.");
        return null;
      }

      const fileSelected = Boolean(imageInput.files && imageInput.files[0]);
      if (fileSelected && !pendingImage) {
        showError("[ERR] anexo não pronto — selecione a imagem de novo.");
        return null;
      }

      const payload = { sentAt: new Date().toISOString(), origin, callsign, lines };
      if (pendingImage && pendingImage.base64) {
        payload.imageBase64 = pendingImage.base64;
        payload.imageName = pendingImage.name;
        payload.imageMime = pendingImage.mime;
        payload.image = {
          src: `data:${pendingImage.mime};base64,${pendingImage.base64}`,
          name: pendingImage.name
        };
      }
      return payload;
    }

    function bindCompose() {
      imageInput.addEventListener("change", async () => {
        clearStatus();
        const file = imageInput.files && imageInput.files[0];
        if (!file) {
          clearPendingImage();
          return;
        }
        if (!String(file.type || "").startsWith("image/")) {
          clearPendingImage();
          showError("[ERR] selecione um arquivo de imagem.");
          return;
        }
        if (file.size > MAX_IMAGE_BYTES) {
          clearPendingImage();
          showError("[ERR] imagem acima de 8MB.");
          return;
        }

        imageLoading = true;
        pendingImage = null;
        setBusy(true);

        try {
          const prepared = await compressImageFile(file);
          pendingImage = {
            base64: prepared.base64,
            name: prepared.name,
            mime: prepared.mime
          };
          imagePreview.src = prepared.previewUrl;
          imagePreview.hidden = false;
          imageClear.hidden = false;
          clearStatus();
        } catch (err) {
          clearPendingImage();
          showError(`[ERR] ${err.message}`);
        } finally {
          imageLoading = false;
          setBusy(false);
        }
      });

      imageClear.addEventListener("click", () => {
        clearPendingImage();
        clearStatus();
      });

      versionBtn.addEventListener("click", async () => {
        clearStatus();
        const version = versionInput.value.trim();
        if (!version) {
          showError("[ERR] informe o número da versão (ex.: 4.2.1).");
          return;
        }

        setBusy(true);
        try {
          const result = await SpaceCommsStore.setTerminalVersion(version);
          versionInput.value = result.terminalVersion;
          showSuccess(`[SYS] v${result.terminalVersion}`);
        } catch (err) {
          showError(`[ERR] ${err.message}`);
        } finally {
          setBusy(false);
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearStatus();

        const payload = readComposePayload();
        if (!payload) return;

        const draft = {
          ...payload,
          id: `preview-${Date.now()}`,
          image: payload.image || undefined
        };
        delete draft.imageBase64;
        delete draft.imageName;
        delete draft.imageMime;

        setBusy(true);
        try {
          const store = await SpaceCommsStore.fetchStore();
          localStorage.setItem(
            PREVIEW_KEY,
            JSON.stringify({
              terminalVersion: store.terminalVersion,
              posts: [...store.posts, draft]
            })
          );
          window.open("index.html?preview=1", "_blank");
        } catch {
          showError("[ERR] falha no preview");
        } finally {
          setBusy(false);
        }
      });

      publishBtn.addEventListener("click", async () => {
        clearStatus();

        const payload = readComposePayload();
        if (!payload) return;

        const hadAttach = Boolean(payload.imageBase64);
        const publishPayload = { ...payload };
        delete publishPayload.image;

        setBusy(true);
        try {
          const created = await SpaceCommsStore.publishPost(publishPayload);
          if (hadAttach && !(created.image && created.image.src)) {
            throw new Error("publicado sem anexo — tente outra imagem");
          }
          const attachInfo = created.image ? ` // attach` : "";
          showSuccess(`[SYS] published // id ${created.id}${attachInfo}`);
          document.getElementById("message").value = "";
          clearPendingImage();
        } catch (err) {
          showError(`[ERR] ${err.message}`);
        } finally {
          setBusy(false);
        }
      });
    }

    updateClock();
    setInterval(updateClock, 1000);

    SpaceCommsAuth.mountGate({
      onReady() {
        loadTerminalVersion();
        bindCompose();
      }
    });
  </script>
</body>
</html>
